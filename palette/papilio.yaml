# ============================================================
# FONTE DA VERDADE do tema Hu Tao.
# Todos os geradores (VSCode, terminal, etc.) leem SÓ este arquivo.
# Nenhum gerador pode conter hex hardcoded.
# ============================================================

meta:
  name: "Papilio"
  slug: "papilio"
  variant: "dark"
  author: "muowl"
  description: "Tema escuro inspirado na paleta da Hu Tao (Genshin Impact)."

# ------------------------------------------------------------
# ÂNCORAS: cores brutas da personagem, para referência e curadoria.
# NÃO são consumidas pelos geradores — são a matéria-prima.
# Refine-as rodando scripts/extract_colors.py nas imagens em references/.
# ------------------------------------------------------------
anchors:
  coat: "#241a19"        # casaco marrom quase preto
  hair-ink: "#3d2c2e"    # castanho-escuro do cabelo, com leve tom ameixa
  hair-tip: "#a34b42"    # pontas castanho-avermelhadas do cabelo
  eyes: "#de4f35"        # olhos vermelho-fogo (pupila em forma de flor)
  blossom: "#c93a30"     # flores de ameixeira do chapéu (vermelho vivo)
  gold-trim: "#b8926a"   # dourado antigo/bronze do chapéu e casaco
  ghost: "#9fd6e3"       # chamas espirituais do kit (VFX em jogo; sem fonte nas imagens de referência)
  boo-white: "#fdf0f2"   # corpo branco-rosado do Boo Tao nas artes oficiais
  ember: "#e0915a"       # pyro / brasas (validada pelo namecard)
  paper: "#ece0d1"       # off-white quente (pele / talismãs)
  ribbon: "#362b3e"      # laço violeta do chapéu (hue 288 — família fria dominante da arte)
  night-sky: "#262b4c"   # céu noturno atrás dela (hue 224 — o outro frio real)

# ------------------------------------------------------------
# PALETA: tokens nomeados que os geradores enxergam.
# Derivada das âncoras, mas ajustada para legibilidade em tela.
# ------------------------------------------------------------
palette:
  # Fundos e estrutura
  bg0: "#191313"        # fundo do editor
  bg1: "#211918"        # sidebar, painéis
  bg2: "#2d2120"        # hover, item ativo em listas
  bg3: "#3a2b28"        # bordas, separadores
  selection: "#4a2f2d"  # seleção de texto

  # ESCADA DE LUMINOSIDADE
  # A ordem dos tokens abaixo é a ordem de L em OKLCH, do que recua ao que é
  # conteúdo. Isso não é estética: daltonismo vermelho-verde colapsa os matizes
  # 20–90° num eixo só, e sobra apenas a luminosidade para diferenciar. Antes
  # desta escada, seis tokens dividiam a faixa L 0.70–0.77 e o par tipo × atributo
  # media ΔE 0.6 sob protanopia — literalmente a mesma cor.
  # Ao mexer em qualquer valor, preserve o matiz (é ele que carrega a personagem)
  # e mantenha o degrau de L.

  # Texto
  fg0: "#ece0d1"        # L 0.91 — texto principal
  fg1: "#a39187"        # L 0.67 — texto secundário, operadores, pontuação
  muted: "#897987"      # L 0.59 — comentários. Migrou do marrom-avermelhado para o
                        # mauve das sombras do cabelo: sai do aglomerado quente e
                        # deixa de colidir com crimson sob protanopia (2.9 → 8.6)

  # Cores de identidade
  crimson: "#df494d"    # L 0.62 — a cor-assinatura (olhos / pontas do cabelo)
  dusk: "#6d84c4"       # L 0.62 — índigo do céu noturno; ATRIBUTOS além do ANSI blue
  plum: "#c796d3"       # L 0.74 — violeta do laço do chapéu e das sombras ameixa
  ember: "#f0a068"      # L 0.77 — laranja-brasa (pyro)
  ghost: "#90d0e1"      # L 0.82 — azul-fantasma do Boo Tao. Única cor sem lastro
                        # nas imagens de referência: vem das chamas espirituais do
                        # kit no jogo. Exceção consciente — é também o respiro frio
                        # de uma paleta que a arte entrega 91% quente
  blossom: "#ffaea9"    # L 0.83 — rosa das flores de ameixeira
  gold: "#c49a5d"       # L 0.71 — dourado dos adornos, bronze antigo da âncora.
                        # Fora da sintaxe densa desde que `attribute` foi para o
                        # dusk: em ANSI yellow e diff `changed` ele não disputa
                        # leitura com o ember, então mantém o tom envelhecido

  # Estados (diagnósticos, git, diffs)
  # Colidem com alguns tokens de sintaxe sob daltonismo, e isso é aceito de
  # propósito: sempre aparecem com fundo tingido, sublinhado ou marcador de gutter
  # reforçando. Clareá-los até passar na métrica os deixaria neon e fora do tema.
  error: "#f2493b"
  warning: "#d8b851"    # saiu de h76, que era idêntico ao gold, para h92
  info: "#90d0e1"       # mesmo valor do ghost — família informativa
  success: "#5e8b58"    # jade discreto — Hu Tao não tem verde, mas diffs precisam.
                        # Escurecido: separa de gold e ember, e fica mais discreto

  # Diversos
  cursor: "#df494d"     # acompanha crimson

# ------------------------------------------------------------
# ROLES: mapeamento semântico. Valores referenciam nomes da paleta.
# É AQUI que se decide "keyword é carmesim", não no gerador.
# ------------------------------------------------------------
roles:
  syntax:
    keyword: crimson      # if, return, const, import
    string: blossom
    function: ghost       # o azul do Boo Tao destaca chamadas
    number: plum          # violeta separa números de atributos (antes ambos dourados)
    constant: plum        # constantes acompanham números, como manda a convenção
    type: ember           # classes, interfaces, tipos
    variable: fg0
    property: fg0
    parameter: fg0
    comment: muted
    operator: fg1
    punctuation: fg1
    tag: crimson          # tags HTML/JSX
    # Atributo em dusk, não em gold. Gold e ember ocupavam o mesmo ponto para
    # quem tem daltonismo vermelho-verde (ΔE 0.6), e <Componente atributo=…>
    # põe tipo e atributo lado a lado. Tirar o gold da sintaxe densa foi o que
    # destravou a paleta inteira — e o dusk é cor da arte, o céu noturno.
    attribute: dusk       # atributos HTML/JSX
    regexp: ember
    escape: ember
    builtin: crimson      # this, self, super — palavra-chave disfarçada de variável
    namespace: ember      # namespaces são parentes de tipo
    # Decorator em plum, não em gold: gold e ember são quase o mesmo matiz sob
    # deuteranopia, e @decorator costuma vir colado no nome da classe.
    decorator: plum
    interpolation: ember  # as marcas ${ } dentro de template strings
    inserted: success     # markup de diff/patch
    deleted: error
    changed: gold
    quote: muted          # citações de markdown (secundário de propósito)

  ui:
    accent: crimson       # badges, foco, statusbar highlights
    link: ghost
    terminal-bg: bg0      # terminal usa a tela do editor: bg1 derrubava o ANSI red para 4.32:1

  # Os 16 slots ANSI. Só as 8 bases são decididas aqui: o gerador deriva
  # cada "bright" clareando a base (ver lighten() em src/lib/palette.ts),
  # o que garante 16 valores distintos com uma regra só.
  terminal:
    black: bg3
    red: crimson
    green: success
    yellow: gold
    blue: dusk            # antes era ghost — azul e ciano eram a mesma cor
    magenta: plum
    cyan: ghost
    white: fg1

  # Exceções à regra "bright = base clareada".
  # bright-black não é chapa: é o cinza que CLIs usam para texto esmaecido
  # (dicas do git, ls, TUIs). Derivá-lo de bg3 dava 2.76:1, ilegível. Aponta
  # para o muted, que é exatamente esse papel dentro do editor.
  terminal-bright:
    black: muted
